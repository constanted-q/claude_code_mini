# Enhanced Claude Code Configuration
# Following Aider's config pattern

# Model settings
model: gpt-4
max_tokens: 4096
temperature: 0.2

# Repository settings  
auto_commits: true
map_tokens: 1024

# Agent settings
max_tools: 10
tool_timeout: 30.0
enable_subagents: true

# Display settings
pretty: true
verbose: false