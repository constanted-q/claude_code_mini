# Enhanced Claude Code Configuration
# Following Aider's config pattern

# Model settings - Kimi K2 via Moonshot API
model: kimi-k2-0711-preview
base_url: https://api.moonshot.cn/v1
max_tokens: 4096
temperature: 0.2

# Repository settings  
auto_commits: true
map_tokens: 1024

# Agent settings
max_tools: 10
tool_timeout: 30.0
enable_subagents: true

# Display settings
pretty: true
verbose: false